[notification]
layer = "overlay"

[osd]
background_opacity = 1
position = "bottom_center"
position_vertical = "top_left"

    [osd.kinds]
    media = false
    privacy = false

[shell]
app_icon_color = "primary"
font_family = "Inter 18pt Medium"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "systemctl hibernate"
    countdown_seconds = 0.0
    enabled = true
    glyph = "hibernate"
    label = "Hibernate"
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

    [shell.shadow]
    direction = "down_right"

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "niri", "qt" ]
    community_ids = [ ]

[widget.battery]
icon_color = "primary"

[widget.control-center]
color = "primary"
glyph = "adjustments"

[widget.input_volume]
icon_color = "primary"

[widget.media]
title_scroll = "on_hover"

    [widget.media.actions]
    scroll_up = "media previous"
    scroll_down = "media next"

[widget.network]
icon_color = "primary"
show_label = false

[widget.notifications]
icon_color = "primary"

[widget.ram]
icon_color = "primary"
visualization = "none"

[widget.spacer_1]
type = "spacer"

[widget.spacer_2]
type = "spacer"

[widget.sysmon]
glyph = "gpu-usage"
icon_color = "primary"
show_value = true
stat = "gpu_temp"
visualization = "none"

[widget.temp]
icon_color = "primary"
visualization = "none"

[widget.tray]
drawer = true
icon_color = "primary"

[widget.volume]
icon_color = "primary"

[widget.workspaces]
active_pill_size = 1.65
focused_output_only = true
hide_when_empty = true
style = "focus_hint"
