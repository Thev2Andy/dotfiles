[audio]
enable_sounds = true

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "primary"
capsule_opacity = 0.65
capsule_padding = 10.0
capsule_radius = 8
capsule_thickness = 0.75
center = []
concave_edge_corners = false
end = [
    "group:g1",
    "spacer_2",
    "network",
    "battery",
    "volume",
    "input_volume",
    "tray",
    "spacer_1",
    "control-center",
    "notifications"
]
font_family = "Inter 18pt"
font_weight = 600
icon_color = "primary"
margin_ends = 0
padding = 5
radius = 0
start = [ "clock", "workspaces", "media" ]
widget_spacing = 5

    [bar.default.dead_zone.actions]
    right = "none"

    [[bar.default.capsule_group]]
    border = "primary"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "temp", "sysmon", "ram" ]
    opacity = 0.65
    padding = 10.0
    radius = 8.0

